<div class="fw-motor-container">
    <!-- Fixed Full-Width Header -->
    <app-plan-type-header class="header-panel"></app-plan-type-header>

    <!-- Main Content Section (Two-Column Layout) -->
    <div class="content-container">
        <!-- Left Side Content (70%) -->
        <div class="left-content">
            <app-payad></app-payad>
            <lib-plans-card-component [config]="myPlanConfig" [data]="plans"
            (selectionChange)="handleSelectionChange($event)" (customBtn)="customize($event)"(additionalBtn)="view($event)" ></lib-plans-card-component>
            <!-- <app-plan-card-summary></app-plan-card-summary> -->
            <app-garages-panel></app-garages-panel>
            <app-policy-wording-template></app-policy-wording-template>
            <app-policy-claim-template></app-policy-claim-template>
        </div>

        <!-- Right Side Content (30%) -->
        <div class="right-content">
            <app-vehicle-details></app-vehicle-details>
        </div>
    </div>
</div>
<app-overlay-side-panel></app-overlay-side-panel>
<app-policy-type-popup></app-policy-type-popup>
